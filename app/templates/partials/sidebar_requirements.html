<div id="req-view" class="flex-1 min-h-0 flex flex-col">
  <div class="flex items-center justify-between px-2.5 pt-2.5">
    <span class="text-[10px] text-ink-400">
      {% if requirements %}v{{ requirements.version_no }} · autosaves{% else %}Not saved yet{% endif %}
    </span>
    <button class="btn btn-ghost !py-0.5 !px-1.5 !text-[10px]"
            hx-post="/projects/{{ project.id }}/import-prd"
            hx-target="#req-view" hx-swap="outerHTML"
            title="Read prd.md / PRD.md from the target folder">⬇ Import PRD</button>
  </div>
  {% if prd_label %}
  <div class="px-2.5 pt-1 text-[10px] text-emerald-600">✓ {{ prd_label }}</div>
  {% endif %}
  <form class="flex-1 flex flex-col min-h-0 p-2.5 pt-1.5"
        hx-post="/projects/{{ project.id }}/requirements"
        hx-target="#req-saved" hx-swap="innerHTML"
        hx-trigger="input changed delay:1200ms from:textarea, submit">
    <div class="flex items-center justify-end mb-1">
      <span id="req-saved" class="text-[10px] text-ink-400"></span>
    </div>
    <textarea name="requirements" spellcheck="false"
              class="field font-mono flex-1 min-h-0 resize-none leading-relaxed !text-[12px]"
              placeholder="Describe the product to build, or click Import PRD to load prd.md from the target folder.&#10;&#10;e.g.&#10;Build a REST API for a task manager with:&#10;- CRUD endpoints for tasks&#10;- SQLite storage&#10;- JWT auth">{{ requirements.raw_text if requirements else '' }}</textarea>
    <button class="btn btn-ghost !py-1 mt-2 justify-center" type="submit">Save Requirements</button>
  </form>
</div>
